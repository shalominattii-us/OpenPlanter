[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-execution-platform"
version = "0.2.0"
description = "Foundry — an autonomous execution platform that turns opportunities into outcomes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
textual = [
    "textual>=0.89",
    "networkx>=3.2",
]

[project.scripts]
foundry-agent = "agent.__main__:main"
foundry-opportunities = "agent.opportunities.runner:main"
foundry = "agent.opportunities.execution_cli:main"
foundry-field-trial = "agent.opportunities.field_trial:main"

# Transitional aliases retained for existing operators and deployments.
openplanter-agent = "agent.__main__:main"
openplanter-opportunities = "agent.opportunities.runner:main"
openplanter-execute = "agent.opportunities.execution_cli:main"
openplanter-field-trial = "agent.opportunities.field_trial:main"

[tool.setuptools.packages.find]
include = ["agent*"]
