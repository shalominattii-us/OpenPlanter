name: Foundry Execution Engine RC

on:
  push:
    branches:
      - "release/universal-execution-engine-*"
      - "brand/foundry"
  pull_request:
    paths:
      - "agent/opportunities/**"
      - "tests/test_*execution*.py"
      - "tests/test_*executor.py"
      - "tests/test_artifact_materialization.py"
      - "pyproject.toml"
      - "README.md"
      - "Dockerfile.execution"
      - ".github/workflows/universal-execution-engine-rc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Foundry and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Verify Foundry CLI and compatibility alias
        run: |
          foundry --help
          openplanter-execute --help
      - name: Run execution engine suite
        run: |
          python -m pytest \
            tests/test_opportunity_execution.py \
            tests/test_execution_record.py \
            tests/test_execution_lifecycle.py \
            tests/test_execution_orchestrator.py \
            tests/test_plugin_runtime.py \
            tests/test_research_executor.py \
            tests/test_eligibility_executor.py \
            tests/test_runtime_result_integration.py \
            tests/test_deterministic_execution_service.py \
            tests/test_deterministic_run_loop.py \
            tests/test_sqlite_execution_store.py \
            tests/test_execution_context_snapshot.py \
            tests/test_execution_cli.py \
            tests/test_artifact_materialization.py \
            tests/test_offer_design_executor.py \
            tests/test_deliverable_builder_executor.py \
            tests/test_outreach_preparation_executor.py \
            tests/test_submission_executor.py \
            tests/test_outcome_tracking_executor.py \
            tests/test_execution_field_trial.py -q
      - name: Run packaged Foundry field trial
        run: |
          foundry-field-trial --workspace /tmp/foundry-field-trial --actor ci-release-gate
          test -f /tmp/foundry-field-trial/execution.sqlite3
          test "$(find /tmp/foundry-field-trial/artifacts -type f | wc -l)" -eq 12
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Foundry execution image
        run: docker build -f Dockerfile.execution -t foundry-execution-engine:rc .
      - name: Verify container command
        run: docker run --rm foundry-execution-engine:rc --help
