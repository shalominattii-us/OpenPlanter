name: Universal Opportunity Domain

on:
  pull_request:
    paths:
      - "agent/opportunities/**"
      - "tests/test_opportunity_*.py"
      - ".github/workflows/universal-opportunity-domain.yml"
  push:
    branches:
      - main
      - feature/universal-opportunity-domain
    paths:
      - "agent/opportunities/**"
      - "tests/test_opportunity_*.py"
      - ".github/workflows/universal-opportunity-domain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Universal Opportunity tests
        run: |
          python -m pytest -q \
            tests/test_opportunity_domain.py \
            tests/test_opportunity_integration.py
