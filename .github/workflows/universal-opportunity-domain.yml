name: Universal Opportunity Domain

on:
  pull_request:
    paths:
      - "agent/opportunities/**"
      - "tests/test_opportunity_*.py"
      - "infra/aws/**"
      - "Dockerfile.opportunities"
      - "docs/aws-opportunity-intake-deployment.md"
      - "pyproject.toml"
      - ".github/workflows/universal-opportunity-domain.yml"
  push:
    branches:
      - main
      - feature/universal-opportunity-domain
    paths:
      - "agent/opportunities/**"
      - "tests/test_opportunity_*.py"
      - "infra/aws/**"
      - "Dockerfile.opportunities"
      - "docs/aws-opportunity-intake-deployment.md"
      - "pyproject.toml"
      - ".github/workflows/universal-opportunity-domain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Universal Opportunity tests
        run: python -m pytest -q tests/test_opportunity_*.py

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint

      - name: Validate CloudFormation
        run: cfn-lint infra/aws/opportunity-intake-scheduled-task.yaml

      - name: Build production intake image
        run: docker build -f Dockerfile.opportunities -t openplanter-opportunities:ci .

      - name: Verify container command
        run: docker run --rm openplanter-opportunities:ci --help
